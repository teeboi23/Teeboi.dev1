    <div id="toast" class="toast" role="status" aria-live="polite">Code copied</div>

    <script>
        (function () {
            var toast = document.getElementById('toast');
            var timer;
            function show(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(timer);
                timer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
            }
            function fallbackCopy(text) {
                var t = document.createElement('textarea');
                t.value = text;
                t.style.position = 'fixed';
                t.style.opacity = '0';
                document.body.appendChild(t);
                t.select();
                var ok = false;
                try { ok = document.execCommand('copy'); } catch (e) {}
                t.remove();
                return ok;
            }
            document.querySelectorAll('.airtime').forEach(function (card) {
                card.addEventListener('click', function () {
                    var code = card.getAttribute('data-code');
                    var done = function (ok) {
                        if (ok) {
                            card.classList.add('copied');
                            card.querySelector('.hint').textContent = 'Copied';
                            show('Code copied');
                        } else {
                            show('Press and hold the code to copy it');
                        }
                    };
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(fallbackCopy(code)); });
                    } else {
                        done(fallbackCopy(code));
                    }
                });
            });
        })();
    </script>
